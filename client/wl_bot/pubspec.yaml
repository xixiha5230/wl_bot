name: wl_bot
description: "WLROBOT cross-platform remote client (macOS / Android / Windows)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.3
  http: ^1.5.0
  shared_preferences: ^2.5.3
  gamepads: ^0.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Local fix for the macOS gamepad plugin: enumerate already-connected pads,
# discover wireless ones and keep sending input while the app is in the
# background. See third_party/gamepads_darwin/README.md.
dependency_overrides:
  gamepads_darwin:
    path: third_party/gamepads_darwin
